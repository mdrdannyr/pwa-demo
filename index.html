<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PWA Demo</title>
  <meta name="description" content="A small installable, offline-capable Progressive Web App demo.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>PWA Demo</h1>
    <div class="header-right">
      <span id="status" class="status" role="status">Checking…</span>
      <div id="auth" class="auth"></div>
    </div>
  </header>

  <main>
    <form id="task-form" autocomplete="off">
      <input id="task-input" type="text" placeholder="Add a task…" aria-label="New task" required>
      <button type="submit">Add</button>
    </form>

    <ul id="task-list"></ul>
    <p id="empty" class="empty" hidden>No tasks yet. Add one above. It works offline too.</p>

    <section id="drive-panel" class="drive-panel" aria-label="Google Drive sync">
      <div class="drive-head">
        <span id="sync-state" class="sync-state" role="status">Local only</span>
        <button id="sync-now" class="secondary" type="button" hidden>Sync now</button>
      </div>
      <p id="sync-detail" class="sync-detail"></p>
      <button id="open-shared" class="secondary" type="button" hidden>Open shared file</button>
      <form id="share-form" class="share-form" hidden>
        <input id="share-email" type="email" placeholder="Collaborator's email" aria-label="Collaborator email" required>
        <button type="submit">Share</button>
      </form>
      <p id="share-note" class="share-note" role="status"></p>
    </section>

    <button id="install-btn" class="install" hidden>Install app</button>
  </main>

  <footer>
    <small>Tasks are saved on this device and synced to your Google Drive when connected. <span id="sw-state"></span></small>
  </footer>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
